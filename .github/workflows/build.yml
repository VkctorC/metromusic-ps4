name: Build MetroMusic PS4 Probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull OpenOrbis toolchain
        run: docker pull openorbisofficial/toolchain:latest

      - name: Build PS4 PKG
        run: |
          docker run --rm \
            --user 0 \
            -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openorbisofficial/toolchain:latest \
            make

      - name: Show outputs
        run: |
          ls -lah
          find . -maxdepth 3 -type f \( -name '*.pkg' -o -name 'eboot.bin' -o -name '*.elf' \) -print

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroMusic-CustomMusicCore-Probe-v0.1
          path: |
            *.pkg
            eboot.bin
          if-no-files-found: error
          retention-days: 14
